name: Update World TV

on:
  schedule:
    # Daily at 03:23 UTC (off the busy top of the hour). GitHub may start it late.
    - cron: '23 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: pytest -q

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      # Last-good copies of every source. If a source is down, the build uses these.
      - name: Restore source cache
        uses: actions/cache/restore@v6
        with:
          path: cache
          key: sources-${{ github.run_id }}
          restore-keys: |
            sources-

      - name: Build playlists
        env:
          # The live site; the safeguard compares against its report.json.
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python -m src.main

      - name: Save source cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: cache
          key: sources-${{ github.run_id }}

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true   # keeps site/.nojekyll

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # GitHub disables scheduled workflows in public repos after 60 days without repository
  # activity. Re-enabling the workflow through the API on each scheduled run keeps it alive
  # without making commits. If it is ever disabled anyway: Actions tab -> Update World TV ->
  # "Enable workflow".
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Keep the scheduled workflow enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method PUT "repos/${{ github.repository }}/actions/workflows/update.yml/enable"
