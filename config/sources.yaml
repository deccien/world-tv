    research:
      last_retrieved: "2026-11-03"
      parsed_count: 2656
      unique_urls_contributed: 2646
      countries_kept: 11
      homepage: https://github.com/matthuisman/i.mjh.nz
      active: true
      feed: JSON (.channels.json, slug "stvp-{id}"); the old all.m3u8 playlists now return 404
      streams: original FAST streams via jmp2.uk redirect to samsungtv.plus
      countries: AT CA CH DE ES FR GB IN IT KR US
      licence: none declared; free ad-supported service
      restrictions: region-locked to the channel's country; needs okhttp user agent (added as EXTVLCOPT)

