# Source registry. Sources are processed in ascending `priority` order (lower = first).
# The first source that lists a URL "owns" it; later identical URLs are counted as duplicates.
#
# type:
#   iptvorg_api  -> IPTV-org JSON API (streams + channels + feeds + logos + blocklist). Use once.
#   m3u          -> any M3U/M3U8 channel list
#   json_custom  -> JSON with a named adapter (famelack, mjh_channels)
#
# country_hints (m3u/json_custom):
#   groups_are_countries: true  -> group-title values that are country names map to that country
#   group_map: {"Group title": "CC"}  explicit group -> ISO code (null = International)
#   default_country: CC         -> fallback for this source
#   exclude_groups_regex: '...' -> drop entries whose group-title matches
#
# `research` is documentation only (filled from the 2026-11-03 retrieval); the live
# numbers for every build are in site/report.json.

sources:
  - id: iptvorg
    name: IPTV-org (API)
    type: iptvorg_api
    enabled: true
    priority: 10
    urls:
      streams: https://iptv-org.github.io/api/streams.json
      channels: https://iptv-org.github.io/api/channels.json
      feeds: https://iptv-org.github.io/api/feeds.json
      logos: https://iptv-org.github.io/api/logos.json
      blocklist: https://iptv-org.github.io/api/blocklist.json
      categories: https://iptv-org.github.io/api/categories.json
      countries: https://iptv-org.github.io/api/countries.json
    research:
      last_retrieved: "2026-11-03"
      parsed_count: 16357
      unique_urls_contributed: 16234
      countries_kept: 180
      homepage: https://github.com/iptv-org/iptv
      active: true
      feed: JSON API + M3U playlists (index.m3u, index.country.m3u, countries/{cc}.m3u)
      streams: redistributed links to broadcasters' own/public streams (community index, hosts nothing)
      countries: worldwide (channel.country on every linked stream)
      licence: Unlicense (playlists/database)
      restrictions: some streams geo-blocked or not 24/7 (labels in streams.json)
      notes: >-
        Chosen ingestion path: streams.json + channels.json (+feeds/logos/blocklist). streams.json
        has 18,457 rows vs 11,389 URLs in index.m3u (index.m3u keeps ~one stream per channel feed
        and omits the 2,100 rows with no known channel: 1,944 null + 156 unknown ids), so the API gives the alternatives too.
        index.country.m3u (12,961 entries) repeats channels per broadcast country and is NOT imported.

  - id: doubo
    name: Doubo Public Channel Directory (streamline-iptv/iptv-playlists)
    type: m3u
    enabled: true
    priority: 20
    url: https://cdn.jsdelivr.net/gh/streamline-iptv/iptv-playlists@dist/index.m3u
    mirror_url: https://raw.githubusercontent.com/streamline-iptv/iptv-playlists/dist/index.m3u
    country_hints:
      groups_are_countries: false     # groups are categories; tvg-country is present
    research:
      last_retrieved: "2026-11-03"
      parsed_count: 4933
      unique_urls_contributed: 1814
      countries_kept: 44
      homepage: https://doubo.tv/en/playlists/
      active: true
      feed: M3U (index, per country/category/language) + dist/index.json
      streams: redistributed; built daily from iptv-org + Free-TV + own discovery, playback-checked, host allowlist
      licence: CC BY 4.0 for generated playlists (LICENSE-DATA.md); code MIT
      restrictions: geo-blocked streams kept; jsDelivr can lag a few hours (raw.githubusercontent mirror)

  - id: freetv
    name: Free-TV/IPTV
    type: m3u
    enabled: true
    priority: 30
    url: https://raw.githubusercontent.com/Free-TV/IPTV/master/playlist.m3u8
    country_hints:
      groups_are_countries: true
      exclude_groups_regex: '^VOD\b'
      group_map:
        "Business": null
        "News": null
        "News (AR)": null
        "News (ES)": null
        "Documentaries (AR)": null
        "Documentaries (EN)": null
        "Music (EN)": null
        "Weather": null
    research:
      last_retrieved: "2026-11-03"
      parsed_count: 2065
      unique_urls_contributed: 798
      countries_kept: 71
      homepage: https://github.com/Free-TV/IPTV
      active: true
      feed: playlist.m3u8 at repo root (generated by make_playlist.py from lists/*.md)
      streams: redistributed links; policy "only free channels" (FTA or free internet - Pluto, Samsung TV Plus, Plex, Roku, YouTube)
      licence: none declared in the repository
      restrictions: geo-blocked channels marked; VOD groups excluded here

  - id: famelack
    name: Famelack data (successor of TV Garden)
    type: json_custom
    adapter: famelack
    enabled: true
    priority: 40
    url: https://raw.githubusercontent.com/famelack/famelack-data/main/tv/raw/categories/all.json
    research:
      last_retrieved: "2026-11-03"
      parsed_count: 7445
      unique_urls_contributed: 888
      countries_kept: 58
      homepage: https://github.com/famelack/famelack-data
      active: true
      feed: JSON per country/category (tv/raw/countries/{cc}.json, tv/raw/categories/all.json)
      streams: redistributed (largely iptv-org derived) + YouTube ids (YouTube entries skipped)
      licence: MIT
      restrictions: isGeoBlocked flag; no NSFW flag (IPTV-org blocklist/NSFW URL set + denylist applied)

  - id: samsungtvplus
    name: Samsung TV Plus (via i.mjh.nz channel data)
