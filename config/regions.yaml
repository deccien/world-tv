    countries: [AE, AO, BF, BH, BI, BJ, BW, CD, CF, CG, CI, CM, CV, CY, DJ, DZ, EG, EH, ER, ET, GA, GH, GM, GN, GQ, GW, IL, IQ, IR, JO, KE, KM, KW, LB, LR, LS, LY, MA, MG, ML, MR, MU, MW, MZ, NA, NE, NG, OM, PS, QA, RE, RW, SA, SC, SD, SH, SL, SN, SO, SS, ST, SY, SZ, TD, TF, TG, TN, TR, TZ, UG, YE, YT, ZA, ZM, ZW]
