# Regional playlists (world-<key>.m3u). A region bigger than max_bytes is split into -1, -2 ... parts.
# Countries by ISO 3166-1 alpha-2 code. Unlisted countries go to asia-pacific (logged). International goes into every regional file.
max_bytes: 2000000
fallback_region: asia-pacific
regions:
  europe:
    name: "Europe"
    countries: [AD, AL, AT, AX, BA, BE, BG, BY, CH, CZ, DE, DK, EE, ES, FI, FO, FR, GG, GI, GR, HR, HU, IE, IM, IS, IT, JE, LI, LT, LU, LV, MC, MD, ME, MK, MT, NL, NO, PL, PT, RO, RS, RU, SE, SI, SJ, SK, SM, UA, UK, VA, XK]
  usa-canada:
    name: "USA & Canada"
    countries: [CA, US]
  latin-america:
