    countries: [AG, AI, AR, AW, BB, BL, BM, BO, BQ, BR, BS, BZ, CL, CO, CR, CU, CW, DM, DO, EC, FK, GD, GF, GL, GP, GS, GT, GY, HN, HT, JM, KN, KY, LC, MF, MQ, MS, MX, NI, PA, PE, PM, PR, PY, SR, SV, SX, TC, TT, UY, VC, VE, VG, VI]
  middle-east-africa:
